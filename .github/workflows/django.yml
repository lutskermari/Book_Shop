name: Django CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: pip install flake8 black

      - name: flake8
        run: |
          flake8 mysite/ \
            --max-line-length=120 \
            --exclude=migrations,__pycache__,.venv \
            --ignore=E501,W503

      - name: black
        run: |
          black --check mysite/ \
            --exclude="migrations|__pycache__|.venv"

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookshop_test
          POSTGRES_USER: bookshop_user
          POSTGRES_PASSWORD: bookshop_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: settings.development
      SECRET_KEY: test-secret-key-for-ci
      POSTGRES_DB: bookshop_test
      POSTGRES_USER: bookshop_user
      POSTGRES_PASSWORD: bookshop_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      STRIPE_SECRET_KEY: sk_test_dummy
      DEBUG: "True"
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd mysite
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          cd mysite
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          cd mysite
          PYTHONPATH=..:. pytest tests/ --cov=bookshop --cov-report=term-missing --cov-fail-under=60 -v

  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bookshop:latest \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/bookshop:${{ github.sha }} \
                       ./mysite
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bookshop:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bookshop:${{ github.sha }}